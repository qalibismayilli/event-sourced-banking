server:
  port: 1210

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/account/**
            - id: replay-service
              uri: lb://replay-service
              predicates:
                - Path=/api/v1/replay/**
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**
    discovery:
      enabled: true
    consul:
      discovery:
        enabled: true
      host: localhost
      port: 8500

